<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فردوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #1a6b4a;
  --accent-soft: rgba(26, 107, 74, 0.12);
  --bg: #f7f6f2;
  --surface: #ffffff;
  --text: #1c1a17;
  --muted: #6b655c;
  --border: #e3ded4;
  --shadow: 0 1px 3px rgba(28, 26, 23, 0.07), 0 4px 14px rgba(28, 26, 23, 0.05);
  --chip-live-bg: var(--accent-soft);
  --chip-live-text: var(--accent);
  --chip-soon-bg: rgba(107, 101, 92, 0.12);
  --chip-soon-text: #6b655c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #4fbf8f;
    --accent-soft: rgba(79, 191, 143, 0.16);
    --bg: #141311;
    --surface: #1e1c19;
    --text: #eae6de;
    --muted: #9a938a;
    --border: #33302a;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
    --chip-live-bg: var(--accent-soft);
    --chip-live-text: var(--accent);
    --chip-soon-bg: rgba(154, 147, 138, 0.15);
    --chip-soon-text: #9a938a;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Naskh Arabic', 'Amiri', 'Traditional Arabic', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 640px;
  margin: 0 auto;
  padding: 56px 20px 48px;
}
header {
  text-align: center;
  margin-bottom: 40px;
}
header h1 {
  font-size: 3rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.3;
}
.cards {
  display: grid;
  gap: 16px;
}
.card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 20px 22px;
  min-height: 64px;
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.card h2 {
  font-size: 1.25rem;
  font-weight: 700;
}
a.card:active { transform: scale(0.985); }
@media (hover: hover) {
  a.card:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 5px rgba(28, 26, 23, 0.09), 0 8px 22px rgba(28, 26, 23, 0.08);
  }
}
.chip {
  flex-shrink: 0;
  font-size: 0.8rem;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
}
.chip.live { background: var(--chip-live-bg); color: var(--chip-live-text); }
.chip.soon { background: var(--chip-soon-bg); color: var(--chip-soon-text); }
.card.disabled { opacity: 0.62; }
</style>
</head>
<body>
<main class="page">
<header>
  <h1>فردوس</h1>
</header>
<section class="cards">
  <a class="card" href="./tafsir/">
    <h2>التفسير</h2>
    <span class="chip live">متاح</span>
  </a>
  <div class="card disabled">
    <h2>الحديث</h2>
    <span class="chip soon">قريباً</span>
  </div>
  <div class="card disabled">
    <h2>العلوم الشرعية</h2>
    <span class="chip soon">قريباً</span>
  </div>
</section>
</main>
</body>
</html>
